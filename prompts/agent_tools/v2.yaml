# Описи інструментів агента (кейс 3). Типи й обмеження аргументів — у Pydantic-моделях (src/agent/tools.py),
# а тексти, які бачить модель (коли викликати, коли ні, що повертає), — тут, щоб версіонувати їх як промпти.
# Зміни — у CHANGELOG.md поруч.
version: v2
date: 2026-11-21

tools:
  search_docs:
    description: >-
      Пошук у корпусі документації: Microsoft Learn (Power Platform ALM, pac CLI, Pipelines, Build Tools,
      CoE Starter Kit) і внутрішні документи Contoso Procurement (release notes, інструкції зі встановлення,
      регресійний тест-план, runbook підтримки). Повертає до 5 фрагментів з source_id, назвою документа,
      розділом, версією й датою.
      ВИКЛИКАЙ, коли питання про те, як щось зробити, налаштувати, що змінилося в релізі за release notes,
      відомі проблеми, процеси, ліміти, тест-кейси.
      НЕ ВИКЛИКАЙ для статусу релізу чи дат у трекері (get_release), списку дефектів (list_defects),
      привітань і загальних питань без зв'язку з документацією.
      Якщо результати не підходять — можна повторити пошук з іншим формулюванням (англійською чи українською),
      але не більше 2 разів для одного питання. Порожній results означає, що в документах цього немає.
    args:
      query: "Пошуковий запит: ключові слова питання; назви компонентів, команд і версій — як у документації"
      product: "Необов'язково. Обмежити продуктом: Contoso Procurement | CoE Starter Kit | pac CLI | ALM | Power Platform Pipelines | Power Platform Build Tools"
      version: "Необов'язково. Версія документа, напр. '1.5' (інструкція) або '1.5.2' (release notes). Вказуй лише якщо користувач назвав версію"

  get_release:
    description: >-
      Картка релізу Contoso Procurement з трекера релізів: статус (released / in_testing / planned),
      дата релізу (null, якщо не призначена), solution, середовища, куди розгорнуто.
      ВИКЛИКАЙ для питань про статус, дату чи розгортання конкретної версії.
      НЕ ВИКЛИКАЙ, щоб дізнатися, що змінилося в релізі (це release notes → search_docs).
      Якщо release_date = null — дата не призначена, не вигадуй її.
    args:
      version: "Версія у форматі X.Y.Z, напр. '1.5.2'"

  list_defects:
    description: >-
      Список дефектів з трекера (лише команди procurement, до якої належить користувач), з фільтрами.
      Повертає id, назву, версію, severity, статус, компонент, середовище, fixed_in.
      ВИКЛИКАЙ для питань «скільки / які дефекти», «що відкрито в релізі», «що виправлено».
      НЕ ВИКЛИКАЙ для відомих проблем, описаних у документації, — для цього search_docs; якщо питання про обидва — виклич обидва.
    args:
      version: "Необов'язково. Версія, у якій знайдено дефект, X.Y.Z"
      severity: "Необов'язково. critical | high | medium | low"
      status: "Необов'язково. open | resolved"

  get_defect:
    description: >-
      Один дефект за id (формат DEF-123). Дефекти інших команд закриті: інструмент поверне ACCESS_DENIED —
      тоді поясни користувачу, що доступу немає, і не шукай ці дані іншими інструментами.
    args:
      defect_id: "Id дефекту, напр. 'DEF-107'"

  create_ticket:
    description: >-
      Створює тікет (баг) у трекері — ДІЯ З ПОБІЧНИМ ЕФЕКТОМ. Перед виконанням система сама запитує
      підтвердження в людини; якщо людина відмовила — тікет не створено, так і скажи.
      ВИКЛИКАЙ лише коли користувач прямо просить створити / завести тікет чи баг.
      title і description сформулюй САМ з опису проблеми користувача — не проси користувача їх писати.
      version і severity мають бути названі користувачем: якщо бракує хоча б одного — НЕ вгадуй, а перепитай саме його.
      Повторний виклик з тими самими даними не створює дубль (поверне already_exists).
    args:
      title: "Короткий заголовок, який ти сам формулюєш з опису користувача, 5–120 символів, мовою користувача"
      version: "Версія, у якій проблема, X.Y.Z — лише та, яку назвав користувач"
      severity: "critical | high | medium | low — лише та, яку назвав користувач"
      description: "Опис проблеми словами користувача: що відбувається, де, кроки (якщо є)"
