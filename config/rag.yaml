# Налаштування RAG (кейс 2). Моделі для генерації відповідей — у config/models.yaml.

corpus:
  sources: data/corpus/sources.json      # метадані документів (download_corpus.py + generate_contoso_docs.py)
  processed_dir: data/processed           # chunks.jsonl, chunks_fixed.jsonl, manifest.json, chunking_comparison.md

chunking:
  strategy: structure     # основна стратегія; fixed — лише для порівняння
  max_tokens: 300         # ліміт чанка (o200k_base); див. README — обґрунтування
  min_tokens: 60          # дрібніші сусідні розділи об'єднуються
  fixed:
    size: 300
    overlap: 50
  comparison_docs:        # документи для ручного порівняння стратегій у chunking_comparison.md
    - learn-cli-solution
    - coe-release-february2026
    - contoso-regression-test-plan-1.5
    - contoso-install-guide-1.5

embeddings:
  model: google/embeddinggemma-300m   # fastembed (ONNX, CPU), 100+ мов, до 2048 токенів
  # промпти моделі EmbeddingGemma для пошуку; prompts: false — порівняльний варіант без них
  prompts: true
  query_template: "task: search result | query: {text}"
  passage_template: "title: {title} | text: {text}"
  cache_dir: .cache/models            # завантажені моделі (не в git)
  vectors_dir: data/index             # кеш embeddings за хешем тексту (у git, щоб CI не перераховував)

index:
  qdrant_path: data/index/qdrant      # локальний режим Qdrant (без сервера), перебудовується з кешу

search:
  candidates: 20          # скільки кандидатів бере кожен пошук (BM25, вектор) перед об'єднанням
  rrf_k: 60               # Reciprocal Rank Fusion
  top_k: 5                # скільки чанків іде у відповідь
  reranker: BAAI/bge-reranker-v2-m3-int8   # багатомовний cross-encoder (INT8, CPU)

retrieval_eval:
  questions: evals/retrieval_questions.jsonl
  ks: [1, 3, 5, 10]
