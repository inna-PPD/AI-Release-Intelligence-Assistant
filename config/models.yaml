# Моделі, параметри семплінгу і налаштування extraction.
# Назви моделей і ціни змінюються тут, а не в коді.

models:
  provider:
    client: openrouter
    id: openai/gpt-4o-mini
    # USD за 1M токенів, з https://openrouter.ai/api/v1/models станом на 18.10.2026
    price_per_1m_tokens: { input: 0.15, output: 0.60 }
  local:
    client: ollama
    id: qwen2.5:7b-instruct   # при < 16 ГБ RAM: qwen2.5:3b-instruct
    price_per_1m_tokens: { input: 0, output: 0 }
  local_json:
    # та сама модель, але без схеми у format (лише "json") — для демонстрації валідації й repair
    client: ollama
    id: qwen2.5:7b-instruct
    structured: false
    price_per_1m_tokens: { input: 0, output: 0 }
  judge:
    # кейс 2: LLM-as-a-judge — інша модель, ніж генератор (gpt-4o-mini), щоб не оцінювала сама себе
    client: openrouter
    id: anthropic/claude-haiku-5.5
    price_per_1m_tokens: { input: 0.10, output: 0.50 }   # openrouter.ai, 12.11.2026

run:
  models: [provider, local]   # що запускає `python main.py run` без --models

sampling:
  A: { temperature: 0.0, top_p: 1.0 }   # детермінована
  B: { temperature: 0.7, top_p: 0.9 }   # «творча»

extraction:
  prompt: extract_defect/v2   # production-версія; v1 — baseline, запуск: --prompt extract_defect/v1
  timeout_s: 60
  retries: 2            # повтори при мережевих помилках / timeout
  repair_attempts: 1    # спроби виправити невалідний JSON
  max_tokens: 1024

data:
  inputs:
    - data/synthetic/defects_synthetic.jsonl
    - data/github/defects_github.jsonl
  results_dir: results

ollama:
  base_url: http://localhost:11434
