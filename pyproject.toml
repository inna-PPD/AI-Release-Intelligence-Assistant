[project]
name = "release-intelligence"
version = "0.1.0"
description = "AI Release Intelligence Assistant — курсовий проєкт AI Engineering"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # кейс 2: ingestion
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    # кейс 2: індекс і пошук
    "numpy>=1.26",
    "fastembed>=0.9",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
